spring:
  application:
    name: ${SPRING_APPLICATION_NAME:nexora-chansey}

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:nexora-chansey}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

server:
  port: ${PORT:8080}

keycloak:
  url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

nexora:
  bayleef:
    base-url: ${NEXORA_BAYLEEF_BASE_URL:http://localhost:8086}
